pre-push:
  parallel: true
  jobs:
    - name: rust-clippy
      glob: "backend/**/*"
      run: cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings
    - name: prettier
      glob:
        - "frontend/**/*.{ts,html,scss,css,json}"
        - "frontend/*.json"
      run: npx prettier --write {staged_files}
      root: frontend  
    - name: angular-build
      glob: "frontend/**/*"
      run: npm run build --prefix frontend
